plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    // No `mappings` line: Minecraft 26.x ships unobfuscated, so Loom needs none.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
    // Ship the Swift helper inside the jar; HelperBinary unpacks it at runtime.
    from('../helper/.build/release') {
        include 'mcdirect-helper'
        into 'native'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// The self-check is a plain main() with asserts, not JUnit. `mod/test.sh` runs the
// same thing without Gradle or a Minecraft classpath.
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the HelperProcess self-check against a fake and the real helper.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.lanoverdirect.HelperProcessSelfCheck'
    jvmArgs = ['-ea']
}

tasks.named('test') {
    failOnNoDiscoveredTests = false   // no JUnit here; selfCheck is the real check
}

tasks.named('check') {
    dependsOn 'selfCheck'
}
